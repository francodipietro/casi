name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc,   preset: debug }
          - { os: ubuntu-latest, cc: clang, preset: debug }
          - { os: ubuntu-latest, cc: clang, preset: dev }
          - { os: macos-latest,  cc: clang, preset: debug }
          - { os: macos-latest,  cc: clang, preset: dev }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgit2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config libgit2

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  valgrind:
    name: valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgit2-dev valgrind
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: |
          ctest --preset debug \
            --overwrite MemoryCheckCommandOptions="--leak-check=full --error-exitcode=1" \
            -T memcheck
