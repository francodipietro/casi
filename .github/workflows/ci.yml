name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# A new push to the same PR makes the previous result obsolete. Cancelling it
# frees runners and means reviewers only wait for the commit they can merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      quick: ${{ steps.filter.outputs.quick }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # Changes that can affect portability, linking, the core sync
            # semantics, or CI itself receive the complete test matrix.
            full:
              - '.github/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'include/**'
              - 'src/core/**'
              - 'src/util/fs.c'
            # Other implementation and test changes still get a fast Linux
            # build. `full` wins when a PR matches both categories.
            quick:
              - 'src/**'
              - 'tests/**'

  quick:
    name: ubuntu-latest / clang / dev
    needs: changes
    if: needs.changes.outputs.full != 'true' && needs.changes.outputs.quick == 'true'
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgit2-dev
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev

  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / ${{ matrix.preset }}
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc,   preset: debug }
          - { os: ubuntu-latest, cc: clang, preset: debug }
          - { os: ubuntu-latest, cc: clang, preset: dev }
          - { os: macos-latest,  cc: clang, preset: debug }
          - { os: macos-latest,  cc: clang, preset: dev }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgit2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config libgit2

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # The distro packages above give us the libssh2 path. Release binaries ship a
  # vendored libgit2 built with the OpenSSH exec transport, so that has to be
  # exercised too -- it is a different code path in casi_ssh_backend().
  vendored:
    name: vendored libgit2 (exec ssh)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev
      - run: cmake --preset static
      - run: cmake --build --preset static
      - name: Verify the exec SSH backend is what got linked
        # Block scalar, not a plain one: the ": " inside the grep pattern
        # would otherwise read as a YAML mapping and break the whole file.
        run: |
          ./build/static/casi --version | grep -q 'ssh: exec'

  valgrind:
    name: valgrind
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgit2-dev valgrind
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - name: Run the unit tests under valgrind
        # Driving valgrind directly rather than via `ctest -T memcheck`: that
        # mode needs the CTest dashboard machinery that include(CTest) sets up,
        # and this repo only calls enable_testing(). Explicit is also easier to
        # read when it fails.
        run: |
          set -eu
          status=0
          for t in build/debug/tests/test_*; do
            [ -x "$t" ] || continue
            [ -f "$t" ] || continue
            echo "== $t"
            valgrind --leak-check=full --errors-for-leak-kinds=definite \
                     --error-exitcode=1 "$t" || status=1
          done
          exit $status

  # This job is deliberately always present. When branch protection becomes
  # available, require only "CI" rather than conditionally skipped job names.
  gate:
    name: CI
    if: always()
    needs: [changes, quick, build, vendored, valgrind]
    runs-on: ubuntu-latest
    steps:
      - name: Verify applicable jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          QUICK: ${{ needs.changes.outputs.quick }}
          QUICK_RESULT: ${{ needs.quick.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VENDORED_RESULT: ${{ needs.vendored.result }}
          VALGRIND_RESULT: ${{ needs.valgrind.result }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }

          [ "$CHANGES_RESULT" = success ] || fail "change classification: $CHANGES_RESULT"

          if [ "$FULL" = true ]; then
            [ "$BUILD_RESULT" = success ] || fail "full build matrix: $BUILD_RESULT"
            [ "$VENDORED_RESULT" = success ] || fail "vendored SSH build: $VENDORED_RESULT"
            [ "$VALGRIND_RESULT" = success ] || fail "valgrind: $VALGRIND_RESULT"
          elif [ "$QUICK" = true ]; then
            [ "$QUICK_RESULT" = success ] || fail "quick build: $QUICK_RESULT"
          fi
